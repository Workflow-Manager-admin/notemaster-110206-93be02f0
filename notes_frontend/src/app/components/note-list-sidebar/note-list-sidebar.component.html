<div class="sidebar-container">
  <div class="sidebar-top">
    <button class="create-btn" (click)="onCreateNote()" title="New Note">
      <span class="plus-icon">+</span> New Note
    </button>
    <input
      class="search-input"
      [(ngModel)]="searchQuery"
      (input)="onSearchChange(searchQuery)"
      type="search"
      placeholder="Search notes..."
      aria-label="Search notes"
      autocomplete="off"
    />
  </div>
  <div class="sidebar-divider"></div>
  <div class="notes-list">
    <ng-container *ngIf="notes.length > 0; else emptyList">
      <div
        *ngFor="let note of notes; trackBy: trackByNoteId"
        class="note-list-item"
        [class.active]="note.id === activeNoteId"
        (click)="onSelectNote(note.id)"
        tabindex="0"
        [attr.aria-selected]="note.id === activeNoteId"
      >
        <div class="note-title">{{ note.title || 'Untitled Note' }}</div>
        <div class="note-date">{{ note.updatedAt | date: 'short' }}</div>
      </div>
    </ng-container>
    <ng-template #emptyList>
      <div class="empty-msg">No notes yet</div>
    </ng-template>
  </div>
</div>
